---
- name: Configure and install vnc-server
  tags: [vnc]
  ansible.builtin.import_tasks: vnc.yml
  notify: Restart lightdm

- name: Configure and install websockify
  tags: [websockify]
  ansible.builtin.import_tasks: websockify.yml
  when: vnc_websocket_enabled | bool

- name: Stop websockify service when disabled
  become: true
  ansible.builtin.systemd_service:
    name: websockify
    enabled: false
    state: stopped
  when: not (vnc_websocket_enabled | bool)
  failed_when: false